<svg width="512" height="512" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Maskable icon: full-bleed square background, clock within safe zone (80% = r≤22.4 from centre).
    Clock centre at (28,28); circle r=24 → rim at 24/28 = 85.7% → within safe zone content at r≤14.
  -->
  <defs>
    <linearGradient id="sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="38%" cy="30%" r="58%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Square maskable background -->
  <rect width="56" height="56" fill="url(#sq)"/>
  <rect width="56" height="56" fill="url(#glow)"/>
  <!-- Clock badge circle -->
  <circle cx="28" cy="28" r="24" fill="url(#sq)"/>
  <circle cx="28" cy="28" r="24" fill="url(#glow)"/>
  <circle cx="28" cy="28" r="24" stroke="url(#rim)" stroke-width="1.4"/>
  <!-- Face ring -->
  <circle cx="28" cy="28" r="17" stroke="white" stroke-opacity="0.18" stroke-width="0.8"/>
  <!-- Cardinal ticks (scaled from 44→56 viewBox: factor 56/44=1.2727, centre 22→28) -->
  <line x1="28.00" y1="13.82" x2="28.00" y2="9.45"  stroke="white" stroke-opacity="0.95" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="42.18" y1="28.00" x2="46.55" y2="28.00" stroke="white" stroke-opacity="0.95" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="28.00" y1="42.18" x2="28.00" y2="46.55" stroke="white" stroke-opacity="0.95" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="13.82" y1="28.00" x2="9.45"  y2="28.00" stroke="white" stroke-opacity="0.95" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Minor ticks -->
  <line x1="35.36" y1="13.76" x2="37.51" y2="10.23" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="42.24" y1="20.64" x2="45.77" y2="18.49" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="42.24" y1="35.36" x2="45.77" y2="37.51" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="35.36" y1="42.24" x2="37.51" y2="45.77" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20.64" y1="42.24" x2="18.49" y2="45.77" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="13.76" y1="35.36" x2="10.23" y2="37.51" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="13.76" y1="20.64" x2="10.23" y2="18.49" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20.64" y1="13.76" x2="18.49" y2="10.23" stroke="white" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Hour hand 10 o'clock (SVG 210°): tail(29.99,28.96)→tip(19.57,23.64) -->
  <line x1="29.99" y1="28.96" x2="19.57" y2="23.64" stroke="white" stroke-width="2.7" stroke-linecap="round"/>
  <!-- Minute hand 10 min / 2 o'clock (SVG -30°): tail(26.34,28.96)→tip(40.50,20.68) -->
  <line x1="26.34" y1="28.96" x2="40.50" y2="20.68" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Pivot -->
  <circle cx="28" cy="28" r="3.2" fill="#F59E0B"/>
  <circle cx="28" cy="28" r="1.3" fill="white" fill-opacity="0.92"/>
</svg>
