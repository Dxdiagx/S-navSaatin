<svg width="32" height="32" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"  stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="glow" cx="36%" cy="28%" r="58%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pivot" cx="40%" cy="25%" r="70%">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- Body -->
  <circle cx="22" cy="22" r="21" fill="url(#bg)"/>
  <circle cx="22" cy="22" r="21" fill="url(#glow)"/>

  <!-- Outer rim -->
  <circle cx="22" cy="22" r="20.3" stroke="white" stroke-opacity="0.18" stroke-width="0.8"/>

  <!-- Clock face track -->
  <circle cx="22" cy="22" r="15.5" stroke="white" stroke-opacity="0.20" stroke-width="0.55"/>

  <!-- Cardinal ticks: 12, 3, 6, 9 -->
  <line x1="22.00" y1="9.40"  x2="22.00" y2="6.50"  stroke="white" stroke-opacity="0.95" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="34.60" y1="22.00" x2="37.50" y2="22.00" stroke="white" stroke-opacity="0.95" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="22.00" y1="34.60" x2="22.00" y2="37.50" stroke="white" stroke-opacity="0.95" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="9.40"  y1="22.00" x2="6.50"  y2="22.00" stroke="white" stroke-opacity="0.95" stroke-width="2.0" stroke-linecap="round"/>

  <!-- Minor ticks: 1,2,4,5,7,8,10,11 -->
  <line x1="29.15" y1="9.62"  x2="29.75" y2="8.57"  stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>
  <line x1="34.38" y1="14.85" x2="35.42" y2="14.25" stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>
  <line x1="34.38" y1="29.15" x2="35.42" y2="29.75" stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>
  <line x1="29.15" y1="34.38" x2="29.75" y2="35.42" stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>
  <line x1="14.85" y1="34.38" x2="14.25" y2="35.42" stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>
  <line x1="9.62"  y1="29.15" x2="8.57"  y2="29.75" stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>
  <line x1="9.62"  y1="14.85" x2="8.57"  y2="14.25" stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>
  <line x1="14.85" y1="9.62"  x2="14.25" y2="8.57"  stroke="white" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round"/>

  <!-- Hour hand (10 o'clock) -->
  <line x1="23.56" y1="22.90" x2="15.42" y2="18.20" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Minute hand (10 min / 2 o'clock) -->
  <line x1="20.44" y1="22.90" x2="32.39" y2="16.00" stroke="white" stroke-width="1.35" stroke-linecap="round"/>

  <!-- Pivot -->
  <circle cx="22" cy="22" r="2.6" fill="url(#pivot)"/>
  <circle cx="22" cy="22" r="2.6" stroke="white" stroke-opacity="0.25" stroke-width="0.5"/>
  <circle cx="22" cy="22" r="0.95" fill="white" fill-opacity="0.88"/>
</svg>
